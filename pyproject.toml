[project]
name = "budget-planner"
version = "0.1.0"
description = "Local-first personal budget planning and fortune tracking web app."
requires-python = ">=3.12,<3.13"
readme = "README.md"
authors = [{ name = "Mikolaj Kublin" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "plotly>=5.24",
  "pandas>=2.2",
  "pyarrow>=17",
  "httpx>=0.27",
  "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.6",
  "beautifulsoup4>=4.12",
  "playwright>=1.47",
  "sqlfluff>=3.1",
  "djlint>=1.35",
  "bandit>=1.7",
  "detect-secrets>=1.5",
  "pre-commit>=3.8",
  "types-python-dateutil>=2.9",
  "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_planner"]

[tool.uv]
package = true
