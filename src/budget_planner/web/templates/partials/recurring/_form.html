{% from "_partials/combobox.html" import combobox %}
{% set rule_account = (accounts|selectattr('id', 'equalto', rule.account_id)|first) if rule else none %}
<form hx-post="{{ action }}"
      hx-target="{% if rule %}#recurring-{{ rule.id }}{% else %}table.ledger tbody{% endif %}"
      hx-swap="{% if rule %}outerHTML{% else %}beforeend{% endif %}"
      class="form-stack"
      {% if not rule %}data-reset-on-submit{% endif %}>
  <label>
    Cadence
    <select name="cadence" required>
      {% for cad in ['monthly', 'quarterly', 'yearly'] %}
        <option value="{{ cad }}"
                {% if rule and rule.cadence.value == cad %}selected{% endif %}>{{ cad|capitalize }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Start
    <input type="date"
           name="start_date"
           value="{{ rule.start_date|date_fmt if rule else today_local() }}"
           data-default-today
           required>
  </label>
  <label>
    <span>Category</span>
    {{ combobox(name="category_id", items=categories,
      value_attr="id", label_attr="name",
      selected_value=rule.category_id if rule else "",
      required=True) }}
  </label>
  <label>
    <span>Account</span>
    {{ combobox(name="account_id", items=accounts,
      value_attr="id", label_attr="name",
      selected_value=rule.account_id if rule else "",
      required=True) }}
  </label>
  <label>
    Amount
    <input type="text"
           name="default_amount"
           value="{{ rule.default_amount|money_major(rule_account.currency if rule_account else 'PLN') if rule else '' }}"
           inputmode="decimal"
           data-numeric
           required>
  </label>
  <label>
    Day of month
    <input type="text"
           name="day_of_month"
           value="{{ rule.day_of_month if rule else '' }}"
           inputmode="numeric">
  </label>
  <label>
    Description
    <input type="text"
           name="default_description"
           value="{{ rule.default_description if rule else '' }}">
  </label>
  {% include "partials/_form_errors.html" %}
  <div class="form-stack__actions">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
