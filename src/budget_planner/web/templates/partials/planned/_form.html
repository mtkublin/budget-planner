{% from "_partials/combobox.html" import combobox %}
{% set planned_account = (accounts|selectattr('id', 'equalto', planned.account_id)|first) if planned else none %}
<form hx-post="{{ action }}"
      hx-target="{% if planned %}#planned-p-{{ planned.id }}{% else %}#planned-table tbody{% endif %}"
      hx-swap="{% if planned %}outerHTML{% else %}afterbegin{% endif %}"
      class="form-stack"
      {% if not planned %}data-reset-on-submit{% endif %}>
  <label>
    Date
    <input type="date"
           name="operation_date"
           value="{{ planned.operation_date|date_fmt if planned else today_local() }}"
           data-default-today
           required>
  </label>
  <label>
    Amount
    <input type="text"
           name="amount"
           value="{{ planned.amount|money_major(planned_account.currency if planned_account else 'PLN') if planned else '' }}"
           inputmode="decimal"
           data-numeric
           required>
  </label>
  <label>
    <span>Category</span>
    {{ combobox(name="category_id", items=categories,
      value_attr="id", label_attr="name",
      selected_value=planned.category_id if planned else "",
      required=True) }}
  </label>
  <label>
    <span>Account</span>
    {{ combobox(name="account_id", items=accounts,
      value_attr="id", label_attr="name",
      selected_value=planned.account_id if planned else "",
      required=True) }}
  </label>
  <label>
    Description
    <input type="text"
           name="description"
           value="{{ planned.description if planned else '' }}">
  </label>
  {% include "partials/_form_errors.html" %}
  <div class="form-stack__actions">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
