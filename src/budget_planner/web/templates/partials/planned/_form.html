<form hx-post="{{ action }}"
      hx-target="{% if planned %}#planned-p-{{ planned.id }}{% else %}#planned-table tbody{% endif %}"
      hx-swap="{% if planned %}outerHTML{% else %}afterbegin{% endif %}"
      class="grid grid-cols-2 gap-3 p-4 border border-[color:var(--rule)] rounded">
  <label>
    Date<input type="date"
       name="operation_date"
       value="{{ planned.operation_date|date_fmt if planned else '' }}"
       required>
  </label>
  <label>
    Amount<input type="text"
       name="amount"
       value="{{ planned.amount if planned else '' }}"
       required>
  </label>
  <label>
    Category
    <select name="category_id" required>
      {% for c in categories %}
        <option value="{{ c.id }}"
                {% if planned and planned.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Account
    <select name="account_id" required>
      {% for a in accounts %}
        <option value="{{ a.id }}"
                {% if planned and planned.account_id == a.id %}selected{% endif %}>{{ a.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="col-span-2">
    Description<input type="text"
       name="description"
       value="{{ planned.description if planned else '' }}">
  </label>
  {% include "partials/_form_errors.html" %}
  <div class="col-span-2 flex justify-end">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
