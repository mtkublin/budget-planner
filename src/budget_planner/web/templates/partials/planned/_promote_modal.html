<div role="dialog"
     aria-modal="true"
     aria-labelledby="promote-title"
     class="fixed inset-0 bg-black/20 flex items-center justify-center">
  <form hx-post="/planned/{{ planned.id if planned else 0 }}/promote"
        hx-target="#planned-p-{{ planned.id if planned else 0 }}"
        hx-swap="outerHTML"
        class="bg-white border border-[color:var(--rule)] p-6 rounded w-96">
    <h2 id="promote-title" class="font-serif text-2xl mb-3">Promote to actual</h2>
    {% if planned %}
      <label class="block">
        Date
        <input type="date"
               name="operation_date"
               value="{{ planned.operation_date|date_fmt }}"
               required>
      </label>
      <label class="block">
        Amount
        <input type="text" name="amount" value="{{ planned.amount|money_major(account.currency if account else 'PLN') }}" required>
      </label>
      <label class="block">
        Description
        <input type="text" name="description" value="{{ planned.description }}">
      </label>
    {% endif %}
    {% include "partials/_form_errors.html" %}
    <div class="mt-4 flex justify-end">
      <button type="submit" class="btn-accent">Promote</button>
    </div>
  </form>
</div>
