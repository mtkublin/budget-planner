{% from "_partials/combobox.html" import combobox %}
<form hx-post="{{ action }}"
      hx-target="{% if account %}#account-{{ account.id }}{% else %}#accounts-grid{% endif %}"
      hx-swap="{% if account %}outerHTML{% else %}beforeend{% endif %}"
      class="form-stack account-form"
      {% if not account %}data-reset-on-submit{% endif %}>
  <label>
    Name
    <input type="text"
           name="name"
           value="{{ account.name if account else '' }}"
           required>
  </label>
  <label>
    Type
    <input type="text" name="type" value="{{ account.type if account else '' }}">
  </label>
  {% if not account %}
    <label>
      <span>Currency</span>
      {{ combobox(name="currency", items=iso_4217_currencies,
        placeholder="Type to filter ISO code…",
        required=True) }}
    </label>
    <label>
      Opening
      <input type="text"
             name="opening_balance"
             value="0"
             data-numeric
             inputmode="decimal">
    </label>
  {% else %}
    <label>
      Currency
      <input type="text" value="{{ account.currency }}" disabled>
    </label>
  {% endif %}
  <label class="form-stack__inline">
    <input type="checkbox"
           name="is_liability"
           data-toggle-limit
           {% if account and account.is_liability %}checked{% endif %}>
    Credit (liability)
  </label>
  <label class="account-form__limit"
         data-limit-field
         {% if not (account and account.is_liability) %}hidden aria-hidden="true"{% endif %}>
    Credit limit
    <input type="text"
           name="credit_limit"
           inputmode="decimal"
           data-numeric
           {% if not (account and account.is_liability) %}disabled{% endif %}
           value="{% if account and account.credit_limit_minor %}{{ account.credit_limit_minor|money_major(account.currency) }}{% endif %}">
  </label>
  {% include "partials/_form_errors.html" %}
  <div class="form-stack__actions">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
<script>
  (function () {
    const form = document.currentScript.previousElementSibling;
    const cb = form.querySelector("[data-toggle-limit]");
    const field = form.querySelector("[data-limit-field]");
    const limitInput = field ? field.querySelector("input[name='credit_limit']") : null;
    if (!cb || !field) return;
    function sync() {
      if (cb.checked) {
        field.removeAttribute("hidden");
        field.removeAttribute("aria-hidden");
        if (limitInput) limitInput.disabled = false;
      } else {
        field.setAttribute("hidden", "");
        field.setAttribute("aria-hidden", "true");
        if (limitInput) limitInput.disabled = true;
      }
    }
    cb.addEventListener("change", sync);
    sync();
  })();
</script>
