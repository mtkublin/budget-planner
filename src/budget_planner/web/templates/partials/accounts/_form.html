<form hx-post="{{ action }}"
      hx-target="{% if account %}#account-{{ account.id }}{% else %}#accounts-grid{% endif %}"
      hx-swap="{% if account %}outerHTML{% else %}beforeend{% endif %}"
      class="account-form grid grid-cols-2 gap-3 p-4 border border-[color:var(--rule)] rounded">
  <label>
    Name<input type="text"
       name="name"
       value="{{ account.name if account else '' }}"
       required>
  </label>
  <label>
    Type<input type="text" name="type" value="{{ account.type if account else '' }}">
  </label>
  {% if not account %}
    <label>
      Currency<input type="text" name="currency" maxlength="3" required>
    </label>
    <label>
      Opening<input type="text" name="opening_balance" value="0">
    </label>
  {% else %}
    <label>
      Currency<input type="text" value="{{ account.currency }}" disabled>
    </label>
  {% endif %}
  <label class="col-span-2 flex items-center gap-2">
    <input type="checkbox"
           name="is_liability"
           data-toggle-limit
           {% if account and account.is_liability %}checked{% endif %}>
    Credit card (liability)
  </label>
  <label class="col-span-2 account-form__limit"
         data-limit-field
         {% if not (account and account.is_liability) %}hidden{% endif %}>
    Credit limit
    <input type="text"
           name="credit_limit"
           inputmode="decimal"
           value="{% if account and account.credit_limit_minor %}{{ account.credit_limit_minor|money_major(account.currency) }}{% endif %}">
  </label>
  {% include "partials/_form_errors.html" %}
  <div class="col-span-2 flex justify-end">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
<script>
  (function () {
    const form = document.currentScript.previousElementSibling;
    const cb = form.querySelector("[data-toggle-limit]");
    const field = form.querySelector("[data-limit-field]");
    if (!cb || !field) return;
    cb.addEventListener("change", () => {
      if (cb.checked) {
        field.removeAttribute("hidden");
      } else {
        field.setAttribute("hidden", "");
      }
    });
  })();
</script>
