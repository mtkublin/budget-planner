{% from "_partials/combobox.html" import combobox %}
<form hx-post="{{ action }}"
      hx-target="{% if account %}#account-{{ account.id }}{% else %}#accounts-grid{% endif %}"
      hx-swap="{% if account %}outerHTML{% else %}beforeend{% endif %}"
      class="form-stack account-form"
      data-account-form
      {% if not account %}data-reset-on-submit{% endif %}>
  <label>
    Name
    <input type="text"
           name="name"
           value="{{ account.name if account else '' }}"
           required>
  </label>
  <label>
    Type
    <input type="text" name="type" value="{{ account.type if account else '' }}">
  </label>
  {% if not account %}
    <label>
      <span>Currency</span>
      {{ combobox(name="currency", items=iso_4217_currencies,
        placeholder="Type to filter ISO code…",
        required=True) }}
    </label>
    <label>
      Opening
      <input type="text"
             name="opening_balance"
             value="0"
             data-numeric
             inputmode="decimal">
    </label>
  {% else %}
    <label>
      Currency
      <input type="text" value="{{ account.currency }}" disabled>
    </label>
  {% endif %}
  <label class="form-stack__inline">
    <input type="checkbox"
           name="is_liability"
           data-toggle-limit
           {% if account and account.is_liability %}checked{% endif %}>
    Credit (liability)
  </label>
  <label class="account-form__limit"
         data-limit-field
         {% if account is none or not account.is_liability %}hidden aria-hidden="true" style="display:none"{% endif %}>
    Credit limit
    <input type="text"
           name="credit_limit"
           inputmode="decimal"
           data-numeric
           {% if account is none or not account.is_liability %}disabled{% endif %}
           value="{% if account and account.credit_limit_minor %}{{ account.credit_limit_minor|money_major(account.currency) }}{% endif %}">
  </label>
  {% include "partials/_form_errors.html" %}
  <div class="form-stack__actions">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
<script>
  // T-123 — Credit-limit field lockstep. Finds the form via `[data-account-form]`
  // (position-independent so nesting inside `partials/_slideover.html` still works).
  // Idempotent: re-running after HTMX swaps does not double-wire the change
  // listener. Fires on initial run + scoped `htmx:afterSwap`.
  (function () {
    function wire(form) {
      if (!form || form.dataset.limitWired === "1") return;
      var cb = form.querySelector("[data-toggle-limit]");
      var field = form.querySelector("[data-limit-field]");
      if (!cb || !field) return;
      var limitInput = field.querySelector("input[name='credit_limit']");
      function sync() {
        if (cb.checked) {
          field.removeAttribute("hidden");
          field.removeAttribute("aria-hidden");
          // `.form-stack label { display: flex }` outweighs UA `[hidden]{display:none}`
          // — clear the inline guard the server renders in the hidden branch.
          field.style.display = "";
          if (limitInput) limitInput.disabled = false;
        } else {
          field.setAttribute("hidden", "");
          field.setAttribute("aria-hidden", "true");
          field.style.display = "none";
          if (limitInput) limitInput.disabled = true;
        }
      }
      cb.addEventListener("change", sync);
      form.dataset.limitWired = "1";
      sync();
    }
    function wireAll() {
      var forms = document.querySelectorAll("[data-account-form]");
      for (var i = 0; i < forms.length; i++) wire(forms[i]);
    }
    wireAll();
    document.addEventListener("htmx:afterSwap", function (evt) {
      // Scope to swaps that landed account-form markup.
      var root = evt.target;
      if (!root) return;
      if (root.matches && root.matches("[data-account-form]")) {
        wire(root);
        return;
      }
      if (root.querySelectorAll) {
        var forms = root.querySelectorAll("[data-account-form]");
        for (var i = 0; i < forms.length; i++) wire(forms[i]);
      }
    });
  })();
</script>
