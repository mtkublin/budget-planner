{# ADR-0056 §6 — Last-checked indicators for the Accounts table. #}
<ul class="rd-last-checked" data-rows="{{ rows|length }}">
  {% for row in rows %}
    <li class="rd-last-checked__row"
        data-account-id="{{ row.account_id }}"
        data-source="{{ row.source }}">
      <span class="rd-last-checked__name">{{ row.account_name }}</span>
      {% if row.last_checked_at %}
        <time class="rd-last-checked__when"
              datetime="{{ row.last_checked_at.isoformat() }}">
          {{ row.last_checked_at.date().isoformat() }}
        </time>
        <span class="rd-last-checked__source">· {{ row.source }}</span>
      {% else %}
        <span class="rd-last-checked__none text-muted">never</span>
      {% endif %}
    </li>
  {% endfor %}
</ul>
