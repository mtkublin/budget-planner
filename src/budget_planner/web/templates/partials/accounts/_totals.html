<section id="account-totals" aria-labelledby="totals-heading" class="mb-6">
  <h2 id="totals-heading" class="sr-only">Totals</h2>
  <dl class="flex gap-6 text-sm">
    {% for ccy, total in totals_by_ccy.items() %}
      <div>
        <dt class="text-muted">{{ ccy }}</dt>
        <dd class="font-serif text-2xl tabular-nums">
          {{ total|money(ccy) }}
        </dd>
      </div>
    {% endfor %}
  </dl>
</section>
