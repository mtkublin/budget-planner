<div role="dialog"
     aria-modal="true"
     aria-labelledby="rec-title"
     class="fixed inset-0 bg-black/20 flex items-center justify-center">
  <form hx-post="/accounts/{{ account.id if account else 0 }}/reconcile"
        hx-target="#account-{{ account.id if account else 0 }}"
        hx-swap="outerHTML"
        class="bg-white border border-[color:var(--rule)] p-6 rounded w-96">
    <h2 id="rec-title" class="font-serif text-2xl mb-3">Reconcile</h2>
    {% if account %}
      <p class="text-muted text-sm mb-3">
        Derived: <span class="tabular-nums">{{ derived|money(account.currency) }}</span>
      </p>
      <label class="block">
        Actual balance
        <input type="text" name="actual_balance" required>
      </label>
    {% endif %}
    {% include "partials/_form_errors.html" %}
    <div class="mt-4 flex justify-end gap-2">
      <button type="submit" class="btn-accent">Reconcile</button>
    </div>
  </form>
</div>
