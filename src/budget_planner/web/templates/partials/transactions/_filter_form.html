<form hx-get="/transactions/table"
      hx-target="#txn-table"
      hx-swap="outerHTML"
      hx-trigger="change delay:200ms, keyup changed delay:400ms from:input[name=q]"
      hx-push-url="true"
      class="space-y-3 text-sm">
  <div class="grid grid-cols-2 gap-2">
    <label>
      From<input type="date" name="date_from">
    </label>
    <label>
      To<input type="date" name="date_to">
    </label>
  </div>
  <label class="block">
    Category
    <select name="category_id">
      <option value="">All</option>
      {% for c in categories %}
        <option value="{{ c.id }}">{{ c.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label class="block">
    Account
    <select name="account_id">
      <option value="">All</option>
      {% for a in accounts %}
        <option value="{{ a.id }}">{{ a.name }}</option>
      {% endfor %}
    </select>
  </label>
  <div class="grid grid-cols-2 gap-2">
    <label>
      Min<input type="number" name="min_amount">
    </label>
    <label>
      Max<input type="number" name="max_amount">
    </label>
  </div>
  <label class="block">
    Search<input type="text" name="q" aria-describedby="q-status">
  </label>
  <span id="q-status" class="sr-only" aria-live="polite"></span>
</form>
