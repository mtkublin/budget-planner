<form id="txn-form"
      hx-post="{{ action }}"
      hx-target="{% if txn %}#txn-{{ txn.id }}{% else %}#txn-table tbody{% endif %}"
      hx-swap="{% if txn %}outerHTML{% else %}afterbegin{% endif %}"
      class="form-stack mb-6">
  <label>
    Date
    <input type="date"
           name="operation_date"
           value="{{ txn.operation_date|date_fmt if txn else '' }}"
           required>
  </label>
  <label>
    Amount
    <input type="text"
           name="amount"
           value="{{ txn.amount if txn else '' }}"
           required>
  </label>
  <label>
    Category
    <select name="category_id" required>
      {% for c in categories %}
        <option value="{{ c.id }}"
                {% if txn and txn.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Account
    <select name="account_id" required>
      {% for a in accounts %}
        <option value="{{ a.id }}"
                {% if txn and txn.account_id == a.id %}selected{% endif %}>{{ a.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Dest (transit)
    <select name="dest_account_id">
      <option value="">—</option>
      {% for a in accounts %}
        <option value="{{ a.id }}"
                {% if txn and txn.dest_account_id == a.id %}selected{% endif %}>{{ a.name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Description
    <input type="text"
           name="description"
           value="{{ txn.description if txn else '' }}">
  </label>
  {% include "partials/_form_errors.html" %}
  <div class="form-stack__actions">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
