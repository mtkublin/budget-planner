{% from "_partials/combobox.html" import combobox %}
{% set txn_account = (accounts|selectattr('id', 'equalto', txn.account_id)|first) if txn else none %}
<form id="txn-form"
      hx-post="{{ action }}"
      hx-target="{% if txn %}#txn-{{ txn.id }}{% else %}#txn-table tbody{% endif %}"
      hx-swap="{% if txn %}outerHTML{% else %}afterbegin{% endif %}"
      class="form-stack mb-6"
      {% if not txn %}data-reset-on-submit{% endif %}>
  <label>
    Date
    <input type="date"
           name="operation_date"
           value="{{ txn.operation_date|date_fmt if txn else today_local() }}"
           data-default-today
           required>
  </label>
  <label>
    Amount
    <input type="text"
           name="amount"
           value="{{ txn.amount|money_major(txn_account.currency if txn_account else 'PLN') if txn else '' }}"
           inputmode="decimal"
           data-numeric
           required
           hx-get="/transactions/_limit_preview"
           hx-include="[name='account_id'],[name='category_id'],[name='amount']"
           hx-target="#limit-preview"
           hx-swap="outerHTML"
           hx-trigger="change delay:200ms, keyup changed delay:400ms">
  </label>
  <label>
    <span>Category</span>
    {{ combobox(name="category_id", items=categories,
      value_attr="id", label_attr="name",
      selected_value=txn.category_id if txn else "",
      required=True) }}
  </label>
  <label>
    <span>Account</span>
    {{ combobox(name="account_id", items=accounts,
      value_attr="id", label_attr="name",
      selected_value=txn.account_id if txn else "",
      required=True) }}
  </label>
  <label>
    <span>Dest (transit)</span>
    {{ combobox(name="dest_account_id", items=accounts,
      value_attr="id", label_attr="name",
      selected_value=txn.dest_account_id if (txn and txn.dest_account_id) else "",
      placeholder="— none —") }}
  </label>
  <label>
    Description
    <input type="text"
           name="description"
           value="{{ txn.description if txn else '' }}">
  </label>
  {% include "partials/_form_errors.html" %}
  {% include "partials/transactions/_limit_preview.html" %}
  <div class="form-stack__actions">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
