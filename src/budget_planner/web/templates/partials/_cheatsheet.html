<dialog id="rd-cheatsheet" class="rd-cheatsheet">
  <form method="dialog"
        style="display: flex;
               justify-content: space-between;
               align-items: center">
    <strong>Keyboard shortcuts</strong>
    <button class="rd-btn rd-btn--sm" aria-label="Close">Esc</button>
  </form>
  <dl>
    <dt>g o</dt>
    <dd>
      Go to Today
    </dd>
    <dt>g l</dt>
    <dd>
      Go to Ledger
    </dd>
    <dt>g p</dt>
    <dd>
      Go to Plan
    </dd>
    <dt>g a</dt>
    <dd>
      Go to Accounts
    </dd>
    <dt>g s</dt>
    <dd>
      Go to Settings
    </dd>
    <dt>n</dt>
    <dd>
      New entry
    </dd>
    <dt>/</dt>
    <dd>
      Search
    </dd>
    <dt>[ · ]</dt>
    <dd>
      Previous · next tab or period
    </dd>
    <dt>?</dt>
    <dd>
      Open this cheatsheet
    </dd>
    <dt>Esc</dt>
    <dd>
      Close any overlay
    </dd>
  </dl>
</dialog>
