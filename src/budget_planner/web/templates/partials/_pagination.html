{# Pagination controls — HTMX-driven. Target table body is swapped outerHTML. #}
<nav class="pagination mt-4 flex items-center gap-3 text-sm"
     aria-label="Pagination">
  {% if page > 1 %}
    <a href="{{ base_path }}?page={{ page - 1 }}{{ extra_qs }}"
       hx-get="{{ base_path }}?page={{ page - 1 }}{{ extra_qs }}"
       hx-target="{{ target|default('#page-table') }}"
       hx-swap="outerHTML"
       class="link-muted">Prev</a>
  {% endif %}
  <span class="text-muted">Page {{ page }}{% if total_pages %} / {{ total_pages }}{% endif %}</span>
  {% if has_next %}
    <a href="{{ base_path }}?page={{ page + 1 }}{{ extra_qs }}"
       hx-get="{{ base_path }}?page={{ page + 1 }}{{ extra_qs }}"
       hx-target="{{ target|default('#page-table') }}"
       hx-swap="outerHTML"
       class="link-muted">Next</a>
  {% endif %}
</nav>
