<div id="forecast-view"
     hx-trigger="forecast-stale from:body"
     hx-get="/forecast/view"
     hx-include="#forecast-controls"
     hx-swap="outerHTML">
  <section class="surface-chart" aria-label="Forecast chart">
    {% include "partials/forecast/_chart.html" %}
  </section>
  <section class="surface-chart mt-6" aria-label="Monthly forecast breakdown">
    <div class="forecast-table-wrap">{% include "partials/forecast/_table.html" %}</div>
  </section>
</div>
