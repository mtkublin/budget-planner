{# T-R50 — server-rendered SVG forecast chart (ADR-0054). #}
<figure id="forecast-chart"
        class="rd-chart rd-chart--line"
        role="img"
        aria-labelledby="forecast-chart-caption">
  <figcaption id="forecast-chart-caption" class="rd-chart__caption">
    Projected balance,
    {% if monthly.months %}
      {{ monthly.months[0].month|date_fmt("%b %Y") }} — {{ monthly.months[-1].month|date_fmt("%b %Y") }}
    {% else %}
      no data available
    {% endif %}
    · {{ monthly.base_currency }}
  </figcaption>
  <svg class="rd-chart__svg rd-chart__svg--line"
       viewBox="{{ chart.view_box }}"
       preserveAspectRatio="xMidYMid meet"
       role="presentation">
    {% for tick in chart.y_axis %}
      <line class="rd-chart__gridline" x1="48" x2="{{ chart.width - 16 }}" y1="{{ tick.position }}" y2="{{ tick.position }}" />
      <text class="rd-chart__y-label" x="42" y="{{ tick.position }}" text-anchor="end" dominant-baseline="middle">{{ tick.label }}</text>
    {% endfor %}
    {% if chart.area_d %}<path class="rd-chart__area" d="{{ chart.area_d }}" />{% endif %}
    {% if chart.line_d %}<path class="rd-chart__line" d="{{ chart.line_d }}" fill="none" />{% endif %}
    {% for tick in chart.x_axis %}
      <text class="rd-chart__x-label" x="{{ tick.position }}" y="{{ chart.height - 10 }}" text-anchor="middle">{{ tick.label }}</text>
    {% endfor %}
  </svg>
</figure>
<p class="text-muted text-sm mt-2">
  Start {{ monthly.start_month|date_fmt("%b %Y") }} · End {{ monthly.end_month|date_fmt("%b %Y") }}
</p>
