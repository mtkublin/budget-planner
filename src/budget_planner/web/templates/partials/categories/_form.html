<form hx-post="{{ action }}"
      hx-target="{% if category %}#category-{{ category.id }}{% else %}table.ledger tbody{% endif %}"
      hx-swap="{% if category %}outerHTML{% else %}beforeend{% endif %}"
      class="form-stack">
  <label>
    Name
    <input type="text"
           name="name"
           value="{{ category.name if category else '' }}"
           required>
  </label>
  {% if not category %}
    <label>
      Direction
      <select name="direction" required>
        {% for d in [Direction.INCOME, Direction.EXPENSE, Direction.TRANSIT] %}
          <option value="{{ d.value }}">{{ d.value|capitalize }}</option>
        {% endfor %}
      </select>
    </label>
  {% endif %}
  {% include "partials/_form_errors.html" %}
  <div class="form-stack__actions">
    <button type="submit" class="btn-accent">Save</button>
  </div>
</form>
