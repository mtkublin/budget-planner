<tr id="category-{{ category.id }}" class="row">
  <td>{{ category.name }}{% if category.is_system %} <span class="text-muted text-xs">(system)</span>{% endif %}</td>
  <td>{{ direction_badge(category.direction) }}</td>
  <td class="text-right space-x-2 text-sm">
    {% if not category.is_system %}
      <button hx-get="/categories/{{ category.id }}/edit"
              hx-target="#cat-form-slot"
              hx-swap="innerHTML"
              aria-label="Edit category {{ category.id }}">Edit</button>
      <button hx-post="/categories/{{ category.id }}/delete"
              hx-target="#category-{{ category.id }}"
              hx-swap="outerHTML"
              hx-confirm="Soft-delete this category?"
              aria-label="Delete category {{ category.id }}">Delete</button>
    {% endif %}
  </td>
</tr>
