{# progress_bar(spent_pct, committed_pct=0, over=False) #}
{%- macro progress_bar(spent_pct, committed_pct=0, over=False) -%}
  {%- set spent = spent_pct|float -%}
  {%- set comm = committed_pct|float -%}
  <span class="rd-progress{% if over %} rd-progress--over{% endif %}">
    <span class="rd-progress__spent" style="width: {{ [spent, 100]|min }}%"></span>
    {%- if comm > 0 -%}
      <span class="rd-progress__committed"
            style="left: {{ [spent, 100]|min }}%;
                   width: {{ [comm, 100 - [spent, 100]|min]|min }}%"></span>
    {%- endif -%}
  </span>
{%- endmacro -%}
