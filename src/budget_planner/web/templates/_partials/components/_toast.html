{# toast(kind="info", message, undo_href=None) — static initial render.
   Runtime toasts flow via HX-Trigger "toast" event (see base.html). #}
{%- macro toast(kind="info", message="", undo_href=None) -%}
  <div class="rd-toast rd-toast--{{ kind }}">
    <span>{{ message }}</span>
    {%- if undo_href -%}
      <button class="rd-toast__undo"
              hx-post="{{ undo_href }}"
              hx-target="body"
              hx-swap="none">Undo</button>
    {%- endif -%}
  </div>
{%- endmacro -%}
