{% extends "base.html" %}
{% block title %}Analytics · Budget Planner{% endblock %}
{% block main %}
  <header class="mb-10">
    <h1 class="font-serif text-5xl leading-none">Analytics</h1>
    <p class="text-muted mt-2">Minor-unit sums divided by 100 for display.</p>
  </header>
  <section class="grid gap-10 grid-cols-1 md:grid-cols-2">
    <article>
      <h2 class="font-serif text-2xl mb-2">Spend by category</h2>
      <div id="chart-spend"
           data-plotly="{{ spend_json }}"
           aria-label="Spend by category"></div>
    </article>
    <article>
      <h2 class="font-serif text-2xl mb-2">Cashflow by account</h2>
      <div id="chart-cashflow"
           data-plotly="{{ cashflow_json }}"
           aria-label="Cashflow by account"></div>
    </article>
    <article class="md:col-span-2">
      <h2 class="font-serif text-2xl mb-2">Income vs expense (monthly)</h2>
      <div id="chart-monthly"
           data-plotly="{{ monthly_json }}"
           aria-label="Income vs expense"></div>
    </article>
  </section>
{% endblock %}
{% block scripts %}
  <script>
    (function() {
      function renderAll() {
        document.querySelectorAll('[data-plotly]').forEach(function(el) {
          var spec = JSON.parse(el.getAttribute('data-plotly'));
          Plotly.newPlot(el, spec.data, spec.layout, { displayModeBar: false });
        });
      }
      document.addEventListener('DOMContentLoaded', renderAll);
    })();
  </script>
{% endblock %}
