{% extends "base.html" %}
{% block title %}Transactions · Budget Planner{% endblock %}
{% block main %}
  <header class="flex items-end justify-between gap-6 mb-10">
    <div>
      <p class="eyebrow mb-2">Ledger</p>
      <h1 class="leading-none">Transactions</h1>
    </div>
    <button hx-get="/transactions/new"
            hx-target="#txn-form-slot"
            hx-swap="innerHTML"
            class="btn-accent">+ New transaction</button>
  </header>
  <div class="grid grid-cols-[260px_1fr] gap-10">
    <aside aria-labelledby="filter-heading"
           class="surface-raised"
           style="padding: var(--space-4)">
      <h2 id="filter-heading" class="sr-only">Filter transactions</h2>
      <p class="eyebrow mb-3">Filter</p>
      {% include "partials/transactions/_filter_form.html" %}
    </aside>
    <section>
      <div id="txn-form-slot"></div>
      {% include "partials/transactions/_table.html" %}
      <div class="hairline-top mt-6 pt-4 flex gap-4 text-sm">
        <span class="eyebrow">Export</span>
        <a class="link-muted" href="/transactions/export?format=csv">CSV</a>
        <a class="link-muted" href="/transactions/export?format=parquet">Parquet</a>
      </div>
    </section>
  </div>
{% endblock %}
