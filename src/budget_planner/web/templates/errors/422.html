{% extends "errors/_shell.html" %}
{% set status = 422 %}
{% set heading = "Check the form" %}
{% block body %}
  {% if fields %}
    <ul role="list" class="form-errors">
      {% for field, msg in fields.items() %}
        <li>
          <strong>{{ field }}</strong>: {{ msg }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Some fields need attention.</p>
  {% endif %}
{% endblock %}
