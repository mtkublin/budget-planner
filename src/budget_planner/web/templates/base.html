<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Budget Planner{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/tailwindcss@3/dist/tailwind.min.css">
    <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
    <script src="https://unpkg.com/htmx.org@2"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    {% block head_extra %}{% endblock %}
  </head>
  <body class="min-h-screen bg-[color:var(--surface)] text-[color:var(--ink)]">
    <a class="skip-link sr-only focus:not-sr-only" href="#main">Skip to content</a>
    <header>
      {% block nav %}
        {% include "partials/_nav.html" %}
      {% endblock %}
    </header>
    <main id="main" tabindex="-1" class="mx-auto max-w-screen-xl px-6 py-10">
      <div id="flash-region"
           role="status"
           aria-live="polite"
           class="flash-region"></div>
      <div id="flash-region-assertive"
           role="alert"
           aria-live="assertive"
           class="flash-region"></div>
      {% block main %}{% endblock %}
    </main>
    <footer class="mx-auto max-w-screen-xl px-6 py-6 text-xs text-muted">
      <p>
        <span class="eyebrow">Budget Planner</span> · local-first
      </p>
    </footer>
    {% block scripts %}{% endblock %}
  </body>
</html>
