{% extends "base.html" %}
{% block title %}Planned · Budget Planner{% endblock %}
{% block main %}
  <header class="flex items-baseline justify-between mb-10">
    <h1 class="font-serif text-5xl leading-none">Planned</h1>
    <button hx-get="/planned/new"
            hx-target="#planned-form-slot"
            hx-swap="innerHTML"
            class="btn-accent">+ New one-off</button>
  </header>
  <div class="grid grid-cols-[280px_1fr] gap-10">
    <aside>
      <form hx-get="/planned/table"
            hx-target="#planned-table"
            hx-swap="outerHTML"
            hx-trigger="change delay:200ms"
            class="space-y-3 text-sm">
        <label>
          From<input type="date" name="date_from">
        </label>
        <label>
          To<input type="date" name="date_to">
        </label>
        <label>
          Scope
          <select name="scope">
            <option value="all">All</option>
            <option value="unpromoted">Unpromoted</option>
          </select>
        </label>
      </form>
    </aside>
    <section>
      <div id="planned-form-slot"></div>
      {% include "partials/planned/_table.html" %}
      <div class="mt-6 flex gap-3 text-sm">
        <a class="link-muted" href="/planned/export?format=csv">Export CSV</a>
        <a class="link-muted" href="/planned/export?format=parquet">Export Parquet</a>
      </div>
    </section>
  </div>
  <div id="modal-root"></div>
{% endblock %}
