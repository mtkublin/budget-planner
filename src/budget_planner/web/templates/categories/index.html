{% extends "base.html" %}
{% block title %}Categories · Budget Planner{% endblock %}
{% block main %}
  <header class="flex items-baseline justify-between mb-10">
    <h1 class="font-serif text-5xl leading-none">Categories</h1>
    <button hx-get="/categories/new"
            hx-target="#cat-form-slot"
            hx-swap="innerHTML"
            class="btn-accent">+ New category</button>
  </header>
  <div id="cat-form-slot" class="mb-6"></div>
  <table class="ledger">
    <caption class="sr-only">Categories</caption>
    <thead>
      <tr>
        <th scope="col">Name</th>
        <th scope="col">Direction</th>
        <th scope="col" class="text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
        {% include "partials/categories/_row.html" %}
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
